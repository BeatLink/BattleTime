[workspace]
resolver = "2"
members = ["boot", "drivers/*", "services/*", "runtime", "ui", "app-host", "simulator", "compiler", "harness"]
# The simulator and the app test harness need std, so plain builds for the watch leave them out.
default-members = ["boot", "drivers/*", "services/*", "runtime", "ui", "app-host"]
# The bootloader builds only for the watch, with its own settings.
exclude = ["bootloader", "firmware", "third_party/littlefs-rust", "third_party/trouble-host", "third_party/trouble-host-macros"]

[workspace.package]
license = "GPL-3.0-or-later"

# littlefs-rust with the core's panicking loop caps turned off; see third_party/littlefs-rust/NEOTIME.md.
[patch.crates-io]
littlefs-rust = { path = "third_party/littlefs-rust" }
# trouble-host with discovery responses that never cut a 128-bit UUID short; see third_party/trouble-host/NEOTIME.md.
trouble-host = { path = "third_party/trouble-host" }
# The GATT server macro that builds a server in place; see third_party/trouble-host-macros/NEOTIME.md.
trouble-host-macros = { path = "third_party/trouble-host-macros" }

# littlefs-rust-core is translated from C and relies on unsigned numbers wrapping, as C's do.
[profile.dev.package.littlefs-rust-core]
overflow-checks = false

# The flash store's power-cut test replays thousands of runs, which takes minutes unoptimised.
[profile.dev.package.neotime-flash-store]
opt-level = 2
