[package]
name = "neotime-bootloader"
version = "0.1.0"
edition = "2021"
description = "NeoTime's bootloader: embassy-boot with the update and recovery slots in external flash"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core", "inline-asm"] }
cortex-m-rt = "0.7"
embassy-boot = "0.7"
embassy-boot-nrf = "0.12"
embassy-embedded-hal = { version = "0.6", default-features = false }
# The NFC pins are plain GPIO on the PineTime; P0.10 resets the touch panel.
embassy-nrf = { version = "0.11", features = ["nrf52832", "rt", "gpiote", "nfc-pins-as-gpio"] }
embassy-sync = "0.8"
embedded-hal = "1.0"
embedded-graphics = "0.8"
embedded-hal-bus = "0.3"
embedded-storage = "0.3"
panic-reset = "0.1"

neotime-battery = { path = "../services/battery" }
neotime-battery-reading = { path = "../drivers/battery_reading" }
neotime-boot = { path = "../boot" }
neotime-button = { path = "../drivers/button" }
neotime-external-flash = { path = "../drivers/external_flash", features = ["cortex-m"] }
neotime-status-screen = { path = "../drivers/status_screen" }
neotime-vibrator = { path = "../drivers/vibrator" }

[build-dependencies]
neotime-boot = { path = "../boot", features = ["build-script"] }

[profile.release]
codegen-units = 1
debug = true
lto = true
opt-level = "s"
