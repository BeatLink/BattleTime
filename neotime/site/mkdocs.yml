# The GitHub Pages site, built with MkDocs Material; tools/build_site.sh stages docs/ and builds from a copy of this file.
site_name: NeoTime
site_description: A firmware for the PineTime smartwatch, written in Rust, with apps that install over Bluetooth.
site_url: https://beatlink.github.io/NeoTime/
repo_url: https://github.com/BeatLink/NeoTime
repo_name: BeatLink/NeoTime
edit_uri: edit/master/neotime/docs/
docs_dir: ../target/site/src
site_dir: ../target/site/out

theme:
  name: material
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/neotime.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# A broken link between pages fails the build under --strict.
validation:
  links:
    not_found: warn
    anchors: warn
    absolute_links: relative_to_docs
    unrecognized_links: warn

nav:
  - Home: index.md
  - Using the watch:
      - About: introduction.md
      - Features: features.md
      - Watch faces: faces.md
      - Firmware updates: updates.md
  - Apps:
      - All apps: apps.md
      # tools/build_site.sh lists a page for each app in docs/apps here.
  - Writing apps:
      - App runtime: app-runtime.md
      - App reference: app-reference.md
      - The app compiler: compiler.md
      - Testing apps: testing.md
      - Companion protocol: companion-protocol.md
  - How it is built:
      - Architecture: architecture.md
      - Architecture assessment: architecture-assessment.md
      - Coding guidelines: coding-guidelines.md
      - Bootloader: bootloader.md
      - Bluetooth controller: bluetooth.md
      - Storage: storage.md
      - Flash store: flash-store.md
      - Memory map: memory-map.md
      - Simulator: simulator.md
      - To do: todo.md
