[package]
name = "neotime-reloader"
version = "0.1.0"
edition = "2021"
description = "Moves a PineTime from InfiniTime or wasp-os onto NeoTime: a one-shot app that installs the bootloader and stages the firmware"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[features]
# Exactly one of these picks where the old system starts apps, and so where this image is linked.
from-wasp-os = []
from-infinitime = []

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core", "inline-asm"] }
cortex-m-rt = "0.7"
embassy-boot = "0.7"
embassy-embedded-hal = { version = "0.6", default-features = false }
# The NFC pins are plain GPIO on the PineTime; P0.10 resets the touch panel.
embassy-nrf = { version = "0.11", features = ["nrf52832", "rt", "nfc-pins-as-gpio"] }
embassy-sync = "0.8"
embedded-graphics = "0.8"
embedded-hal = "1.0"
embedded-storage = "0.3"
mipidsi = "0.10"
panic-halt = "1.0"
static_cell = "2.1"

neotime-boot = { path = "../boot" }
neotime-display = { path = "../drivers/display" }
neotime-external-flash = { path = "../drivers/external_flash", features = ["cortex-m"] }

[build-dependencies]
neotime-boot = { path = "../boot" }

[profile.release]
codegen-units = 1
debug = true
lto = true
opt-level = "s"
