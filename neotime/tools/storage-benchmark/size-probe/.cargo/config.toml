[build]
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
rustflags = ["-C", "link-arg=-Tlink.x"]

# ekv's layout, as in the benchmark: a 3 MB store of 4 KB pages, 4-byte keys, values up to 8 KB, 256-byte reads.
[env]
EKV_PAGE_SIZE = "4096"
EKV_MAX_PAGE_COUNT = "768"
EKV_MAX_KEY_SIZE = "4"
EKV_MAX_VALUE_SIZE = "8192"
EKV_MAX_CHUNK_SIZE = "256"
