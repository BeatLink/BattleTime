[workspace]
resolver = "2"
members = ["boot", "drivers/*", "services/*", "runtime", "aot", "module-abi", "ui", "app-host", "simulator", "compiler", "harness"]
# The simulator and the app test harness need std, so plain builds for the watch leave them out.
default-members = ["boot", "drivers/*", "services/*", "runtime", "aot", "module-abi", "ui", "app-host"]
# The bootloader builds only for the watch, with its own settings.
exclude = ["bootloader", "firmware", "modules", "third_party/trouble-host", "third_party/trouble-host-macros"]

[workspace.package]
license = "GPL-3.0-or-later"

[patch.crates-io]
# trouble-host with discovery responses that never cut a 128-bit UUID short; see third_party/trouble-host/BATTLETIME.md.
trouble-host = { path = "third_party/trouble-host" }
# The GATT server macro that builds a server in place; see third_party/trouble-host-macros/BATTLETIME.md.
trouble-host-macros = { path = "third_party/trouble-host-macros" }

# The flash store's power-cut test replays thousands of runs, which takes minutes unoptimised.
[profile.dev.package.battletime-flash-store]
opt-level = 2
