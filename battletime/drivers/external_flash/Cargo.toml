[package]
name = "battletime-external-flash"
version = "0.1.0"
edition = "2021"
description = "PineTime 4 MB XT25F32B SPI NOR flash driver"
license.workspace = true
publish = false

[features]
# Adds `BusyWait`, a delay for the watch that spins the CPU.
cortex-m = ["dep:cortex-m"]

[dependencies]
cortex-m = { version = "0.7", optional = true }
embedded-hal = "1.0"
embedded-hal-async = "1.0"
embedded-storage = "0.3"
embedded-storage-async = "0.4"

[dev-dependencies]
embassy-futures = "0.1"
