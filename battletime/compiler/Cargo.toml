[package]
name = "battletime-compiler"
version = "0.1.0"
edition = "2021"
description = "Compiles BattleTime apps written as Preact components into app images"
license.workspace = true
publish = false

[dependencies]
battletime-runtime = { path = "../runtime", features = ["writer"] }
# Bosch's accelerometer configuration files, which the shared library carries for the firmware.
battletime-accelerometer = { path = "../drivers/accelerometer", features = ["configuration-files"] }
oxc_allocator = "=0.151.0"
oxc_ast = "=0.151.0"
oxc_parser = "=0.151.0"
oxc_span = "=0.151.0"
oxc_syntax = "=0.151.0"
# Images: PNG decoding for an app's own pictures, and the shared library's icons drawn from fonts.
png = "=0.18.1"
ab_glyph = "=0.2.29"
miniz_oxide = "=0.8.9"
