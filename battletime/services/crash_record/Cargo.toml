[package]
name = "battletime-crash-record"
version = "0.1.0"
edition = "2021"
description = "Why the watch last restarted: the reset reasons in words, the panic or fault record kept in RAM across a reset, and the screen that shows it"
license.workspace = true
publish = false

[dependencies]
embedded-graphics = "0.8"
heapless = "0.9"
battletime-boot = { path = "../../boot" }
# Whoever draws the pages picks the status page's font, so this crate asks for none.
battletime-status-screen = { path = "../../drivers/status_screen", default-features = false }

[dev-dependencies]
battletime-status-screen = { path = "../../drivers/status_screen", features = ["bitmap-font"] }
