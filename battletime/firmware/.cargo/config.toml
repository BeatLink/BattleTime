[build]
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
runner = "probe-rs run --chip nRF52832_xxAA"
rustflags = ["-C", "link-arg=-Tlink.x"]

# TrouBLE's queue of outgoing packets waits when full, so four is enough; the incoming one drops when full and stays at eight.
[env]
TROUBLE_HOST_L2CAP_TX_QUEUE_SIZE = "4"
