# Runs the watch's host tests with coverage, the lints, and the watch builds whenever neotime/, docs/, tools/ or the flake changes.
name: NeoTime

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths: ["neotime/**", "docs/**", "tools/**", "flake.nix", "flake.lock", ".github/workflows/neotime.yml"]
  pull_request:
    paths: ["neotime/**", "docs/**", "tools/**", "flake.nix", "flake.lock", ".github/workflows/neotime.yml"]
  workflow_dispatch:

# A newer push to a pull request replaces its older run; every commit on master keeps its own result.
concurrency:
  group: neotime-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pull-request' || github.sha }}
  cancel-in-progress: true

jobs:
  tests-and-coverage:
    name: Tests and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neotime
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
      - name: Install the TypeScript dependencies
        run: nix develop --command npm ci
      - name: Run every test with coverage and check the floors
        run: nix develop --command ../tools/check_coverage.sh
      - name: Keep the coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            neotime/target/coverage-rust.lcov
            neotime/target/coverage-typescript/
      - name: Keep the pictures of screens that no longer match
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-failures
          path: neotime/target/snapshot-failures/
          if-no-files-found: ignore

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neotime
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Check the formatting
        run: nix develop --command cargo fmt --all --check

  lints:
    name: Lints and types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neotime
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: nix develop --command cargo clippy --workspace --all-targets -- --deny warnings
      - name: Check the TypeScript types
        run: nix develop --command bash -c "npm ci && npm run check"

  watch-lints:
    # The firmware and bootloader build only for the watch and sit outside the workspace, so they are linted on their own.
    name: Watch lints (${{ matrix.build.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build:
          - { name: firmware, crate: firmware, features: "--release" }
          - { name: recovery firmware, crate: firmware, features: "--profile recovery --features recovery" }
          - { name: wasp-os rehearsal, crate: firmware, features: "--release --features wasp-os-rehearsal" }
          - { name: storage rehearsal, crate: firmware, features: "--release --features wasp-os-storage-rehearsal" }
          - { name: bootloader, crate: bootloader, features: "--release" }
    defaults:
      run:
        working-directory: neotime/${{ matrix.build.crate }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: neotime/${{ matrix.build.crate }} -> target
      - name: Check the formatting
        run: nix develop ../.. --command cargo fmt --check
      - name: Run clippy
        run: nix develop ../.. --command cargo clippy ${{ matrix.build.features }} -- --deny warnings

  memory-map:
    # Measures the firmware and file system into docs/memory-map.md, and on master commits the tables when they change.
    name: Memory map
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: neotime
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            neotime -> target
            neotime/firmware -> target
      - name: Measure the firmware and file system
        run: nix develop --command python3 -I ../tools/measure_memory.py
      - name: Keep the measured page
        uses: actions/upload-artifact@v4
        with:
          name: memory-map
          path: |
            docs/memory-map.md
            docs/memory-treemap.html
      - name: Commit the tables when they changed
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          if git diff --quiet -- ../docs/memory-map.md ../docs/memory-treemap.html; then
            echo "The memory map is current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "docs(memory-map): measure ${GITHUB_SHA::7}" -- ../docs/memory-map.md ../docs/memory-treemap.html
          # A push in the meantime is retried on top of it; a newer page there means that push's own run measures again.
          for attempt in 1 2 3; do
            if ! git pull --quiet --rebase origin master; then
              git rebase --abort
              echo "The memory map changed on master since this run; the newer run measures it."
              exit 0
            fi
            if git push --quiet origin HEAD:master; then
              exit 0
            fi
            sleep 10
          done
          exit 1

  watch-images:
    name: Watch images
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neotime
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            neotime -> target
            neotime/bootloader -> target
            neotime/firmware -> target
            neotime/reloader -> target
      - name: Build the workspace for the watch
        run: nix develop --command cargo build --release --target thumbv7em-none-eabihf
      - name: Build the bootloader, firmware and reloaders
        run: nix develop --command ../tools/build_images.sh
      - name: Keep the images
        uses: actions/upload-artifact@v4
        with:
          name: watch-images
          path: neotime/dist/

  emulator-suites:
    # Runs neotime/tests/emulator on the images above in PineTimeEmulator, set out beside this repository as the suites expect.
    name: Emulator suites
    runs-on: ubuntu-latest
    needs: watch-images
    steps:
      - uses: actions/checkout@v5
        with:
          path: NeoTime
      - uses: actions/checkout@v5
        with:
          repository: BeatLink/PineTimeEmulator
          path: PineTimeEmulator
      - uses: cachix/install-nix-action@v31
      - uses: actions/download-artifact@v4
        with:
          name: watch-images
          path: dist
      - name: Place InfiniTime's bootloader where an InfiniTime checkout would hold it
        run: ln -s "$(nix build --no-link --print-out-paths ./PineTimeEmulator#infinitime-bootloader)" InfiniTime
      - name: Run the suites, except those that need a wasp-os build
        run: >
          nix develop ./PineTimeEmulator --command pinetime-test -r emulator-results
          --variable DIST:$PWD/dist NeoTime/neotime/tests/emulator/*.robot
      - name: Keep the suite logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-results
          path: emulator-results/

  release:
    # Publishes the images built above as the assets of a GitHub release, one per version tag.
    name: Release
    runs-on: ubuntu-latest
    needs: watch-images
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: watch-images
          path: dist
      - name: Publish the images to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
