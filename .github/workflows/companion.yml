# Runs the companion's tests with coverage, the type check, the lint, the window and CLI builds, the Rust core, the Nix package and the Android app whenever companion/ or the flake changes.
name: Companion

on:
  push:
    branches: [master]
    paths: ["companion/**", "flake.nix", "flake.lock", ".github/workflows/companion.yml"]
  pull_request:
    paths: ["companion/**", "flake.nix", "flake.lock", ".github/workflows/companion.yml"]
  workflow_dispatch:

# A newer push to a pull request replaces its older run; every commit on master keeps its own result.
concurrency:
  group: companion-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pull-request' || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: companion

jobs:
  checks:
    name: Tests, coverage, types and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: companion/package-lock.json
      - name: Install the dependencies
        run: npm ci
      - name: Run the tests with coverage and check the floors
        run: npm run coverage
      - name: Check the types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build the window
        run: npm run build
      - name: Build the command line tool
        run: npm run build:cli
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-coverage
          path: companion/coverage/

  rust:
    name: Rust tests and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      # The Tauri crate embeds dist/ when it builds, so an empty page stands in for the Vite build.
      - name: Stand in for the window
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
      - name: Run the tests
        run: nix develop ..#companion --command cargo test --workspace
      - name: Run clippy
        run: nix develop ..#companion --command cargo clippy --workspace --all-targets -- -D warnings

  nix:
    name: Nix package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      # Fails when package-lock.json changes without npmDepsHash in flake.nix.
      - name: Build the desktop app and command line tool
        run: nix build ..#companion --print-build-logs

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: companion -> target
      - name: Install the dependencies
        run: nix develop ..#companion-android --command npm ci
      # Signs with the release key when the secrets are there, so a master build installs over a release.
      - name: Write the signing key
        if: github.event_name != 'pull_request'
        working-directory: companion/tauri/gen/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > keystore.properties
      - name: Build the app for every phone processor
        run: |
          nix develop ..#companion-android --command npm run tauri-android:release
          mkdir -p ../apk
          cp tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release*.apk \
            "../apk/BattleTime-Companion-${GITHUB_SHA::8}.apk"
      - name: Delete the signing key
        if: always()
        working-directory: companion/tauri/gen/android
        run: rm -f release.jks keystore.properties
      - uses: actions/upload-artifact@v4
        with:
          name: companion-android
          path: apk/
