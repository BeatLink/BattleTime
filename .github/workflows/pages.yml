# Builds the GitHub Pages site on every push and pull request, and publishes it from master.
name: Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Only the newest master push publishes; an older run still building is cancelled.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Build the landing page and the docs
        run: nix develop --command tools/build_site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/out

  deploy:
    name: Publish the site
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
