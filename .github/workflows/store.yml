# Builds every app, face and plugin into the store's files whenever they or what compiles them change,
# keeps them as the neotime-store artifact, and on master republishes them as the apps-latest pre-release.
name: Store

on:
  push:
    branches: [master]
    paths:
      - "neotime/apps/**"
      - "neotime/faces/**"
      - "neotime/compiler/**"
      - "neotime/runtime/**"
      - "neotime/sdk/**"
      - "companion/plugins/**"
      - "companion/scripts/build-plugin.mjs"
      - "docs/apps/**"
      - "docs/faces.md"
      - "tools/build_store.py"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/store.yml"
  pull_request:
    paths:
      - "neotime/apps/**"
      - "neotime/faces/**"
      - "neotime/compiler/**"
      - "neotime/runtime/**"
      - "neotime/sdk/**"
      - "companion/plugins/**"
      - "companion/scripts/build-plugin.mjs"
      - "docs/apps/**"
      - "docs/faces.md"
      - "tools/build_store.py"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/store.yml"
  workflow_dispatch:

# A newer push to a pull request replaces its older run; master runs one at a time so apps-latest ends on the newest.
concurrency:
  group: store-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pull-request' || 'push' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: neotime -> target
      - name: Install the companion's dependencies, which build the plugins
        working-directory: companion
        run: nix develop .. --command npm ci
      - name: Compile every app and face and pack every plugin
        working-directory: neotime
        run: nix develop --command python3 -I ../tools/build_store.py
      - name: Keep the store
        uses: actions/upload-artifact@v4
        with:
          name: neotime-store
          path: neotime/dist/store/

  latest:
    # The companion's store finds these without a GitHub token, unlike the artifact.
    name: Publish apps-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: neotime-store
          path: store
      - name: Move apps-latest to this commit and replace its files
        run: |
          rm store/shared.ntlib
          if ! gh release view apps-latest > /dev/null 2>&1; then
            gh release create apps-latest --prerelease --target "$GITHUB_SHA" --title "Apps (latest master)" \
              --notes "Every app, face and plugin built from the newest master. The companion's store reads neotime-store.zip."
          fi
          gh api --method PATCH "repos/$GH_REPO/git/refs/tags/apps-latest" -f sha="$GITHUB_SHA" -F force=true > /dev/null \
            || gh api --method POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/apps-latest -f sha="$GITHUB_SHA" > /dev/null
          gh release upload apps-latest store/* --clobber
          # An app taken out of the repository leaves the release too.
          for asset in $(gh release view apps-latest --json assets --jq '.assets[].name'); do
            if [ ! -e "store/$asset" ]; then gh release delete-asset apps-latest "$asset" --yes; fi
          done
