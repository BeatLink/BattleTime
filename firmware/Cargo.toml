[package]
name = "neotime-firmware"
version = "0.1.0"
edition = "2021"
description = "NeoTime's firmware for the PineTime: starts the drivers, advertises over Bluetooth and takes updates"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[features]
# An app for wasp-os that proves Bluetooth on the watch and writes no flash; see docs/updates.md.
wasp-os-rehearsal = ["cortex-m-rt/set-vtor"]
# The rehearsal plus NeoTime's flash driver and littlefs on the real chip; erases wasp-os's files.
wasp-os-storage-rehearsal = ["wasp-os-rehearsal"]
# The image for the recovery slot: its status page always says it is the recovery firmware.
recovery = []

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core", "inline-asm"] }
cortex-m-rt = "0.7"
embassy-embedded-hal = { version = "0.6", default-features = false }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1"
# The NFC pins are plain GPIO on the PineTime; P0.10 resets the touch panel.
embassy-nrf = { version = "0.11", features = ["nrf52832", "rt", "gpiote", "time-driver-rtc1", "time", "nfc-pins-as-gpio"] }
embassy-sync = "0.8"
embassy-time = { version = "0.5", features = ["tick-hz-32_768"] }
embedded-alloc = "0.7"
embedded-graphics = "0.8"
embedded-hal = "1.0"
embedded-storage = "0.3"
embedded-storage-async = "0.4"
heapless = "0.9"
littlefs-rust = "0.1"
nrf-pac = { version = "0.4", features = ["nrf52832"] }
static_cell = "2.1"
trouble-host = { version = "0.8", default-features = false, features = ["peripheral", "gatt", "derive", "default-packet-pool", "default-packet-pool-mtu-128", "default-packet-pool-size-8"] }

neotime-accelerometer = { path = "../drivers/accelerometer" }
neotime-app-host = { path = "../app-host" }
neotime-bluetooth = { path = "../drivers/bluetooth" }
neotime-boot = { path = "../boot" }
neotime-companion = { path = "../services/companion" }
neotime-current-time = { path = "../services/current_time" }
neotime-crash-record = { path = "../services/crash_record" }
neotime-liveness = { path = "../services/liveness" }
neotime-foreground = { path = "../services/foreground" }
neotime-battery = { path = "../services/battery" }
neotime-blefs = { path = "../services/blefs", features = ["trouble"] }
neotime-button = { path = "../drivers/button" }
neotime-dfu = { path = "../services/dfu", features = ["trouble"] }
neotime-notifications = { path = "../services/notifications" }
neotime-flash-store = { path = "../services/flash_store" }
neotime-packages = { path = "../services/packages" }
neotime-display = { path = "../drivers/display" }
neotime-external-flash = { path = "../drivers/external_flash", features = ["cortex-m"] }
neotime-runtime = { path = "../runtime" }
neotime-settings = { path = "../services/settings" }
neotime-steps = { path = "../services/steps" }
neotime-status-screen = { path = "../drivers/status_screen" }
neotime-storage = { path = "../services/storage" }
neotime-touch = { path = "../drivers/touch" }
neotime-vibrator = { path = "../drivers/vibrator" }
neotime-updates = { path = "../services/updates" }

[build-dependencies]
neotime-boot = { path = "../boot" }
neotime-compiler = { path = "../compiler" }

# littlefs-rust with the core's panicking loop caps turned off; see third_party/littlefs-rust/NEOTIME.md.
[patch.crates-io]
littlefs-rust = { path = "../third_party/littlefs-rust" }
# trouble-host with discovery responses that never cut a 128-bit UUID short; see third_party/trouble-host/NEOTIME.md.
trouble-host = { path = "../third_party/trouble-host" }
# The GATT server macro that builds a server in place; see third_party/trouble-host-macros/NEOTIME.md.
trouble-host-macros = { path = "../third_party/trouble-host-macros" }

[profile.release]
codegen-units = 1
debug = true
lto = true
opt-level = "s"

[profile.dev.package.littlefs-rust-core]
overflow-checks = false
