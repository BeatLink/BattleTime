[package]
name = "neotime-accelerometer"
version = "0.1.0"
edition = "2021"
description = "PineTime BMA421 and BMA425 accelerometer and step counter driver, async over I2C"
license.workspace = true
publish = false

[features]
# Gives Bosch's 6 KB configuration file for each chip as constants, for the compiler to put in the
# shared library; the firmware takes them from there, so it leaves this off.
configuration-files = []

[dependencies]
embedded-hal = "1.0"
embedded-hal-async = "1.0"

[dev-dependencies]
embassy-futures = "0.1"
