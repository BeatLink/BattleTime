[package]
name = "neotime-accelerometer"
version = "0.1.0"
edition = "2021"
description = "PineTime BMA421 and BMA425 accelerometer and step counter driver, async over I2C"
license.workspace = true
publish = false

[features]
default = ["bma421", "bma425"]
# Each chip needs its own 6 KB configuration file from Bosch, so a watch build can leave one out.
bma421 = []
bma425 = []

[dependencies]
embedded-hal = "1.0"
embedded-hal-async = "1.0"

[dev-dependencies]
embassy-futures = "0.1"
