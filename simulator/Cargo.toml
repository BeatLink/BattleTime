[package]
name = "neotime-simulator"
version = "0.1.0"
edition = "2021"
description = "Runs the NeoTime drivers on the desktop against a simulated PineTime"
license.workspace = true
publish = false

[dependencies]
embassy-futures = "0.1"
embedded-graphics = "0.8"
embedded-graphics-simulator = "0.7"
embedded-hal = "1.0"
embedded-hal-async = "1.0"
mipidsi = "0.10"
neotime-app-host = { path = "../app-host", features = ["demo"] }
neotime-display = { path = "../drivers/display" }
neotime-runtime = { path = "../runtime" }
neotime-settings = { path = "../services/settings" }
neotime-vibrator = { path = "../drivers/vibrator" }

[dev-dependencies]
# The status screen the bootloader uses is tested against this panel model too.
neotime-status-screen = { path = "../drivers/status_screen" }
