[package]
name = "neotime-storage-size-probe"
version = "0.1.0"
edition = "2021"
description = "A watch build with one store, so its size less the plain build's is what the store costs"
license = "GPL-3.0-or-later"
publish = false

# Kept out of NeoTime's workspace: a measuring tool, built for the watch with the firmware's release settings.
[workspace]

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core", "inline-asm"] }
cortex-m-rt = "0.7"
embedded-alloc = "0.7"
embassy-futures = "0.1"
embedded-storage = "0.3"
embedded-storage-async = "0.4"

ekv = { version = "1.0.0", features = ["crc"], optional = true }
# ekv 1.0 takes its mutex from embassy-sync 0.6; the firmware uses 0.8, so the watch would carry both.
embassy-sync-for-ekv = { package = "embassy-sync", version = "0.6", optional = true }
sequential-storage = { version = "8.0.2", optional = true }
neotime-storage = { path = "../../../services/storage", optional = true }
neotime-flash-store = { path = "../../../services/flash_store", optional = true }

[features]
ekv = ["dep:ekv", "dep:embassy-sync-for-ekv"]
sequential = ["dep:sequential-storage"]
littlefs = ["dep:neotime-storage"]
flash-store = ["dep:neotime-flash-store"]

# The same patched littlefs-rust the firmware builds; see third_party/littlefs-rust/NEOTIME.md.
[patch.crates-io]
littlefs-rust = { path = "../../../third_party/littlefs-rust" }

# The firmware's release settings.
[profile.release]
codegen-units = 1
debug = true
lto = true
opt-level = "s"
