<!doctype html>
<!-- The Timer plugin's page: the chosen length, and whether the timer runs and when it ends. It talks to the plugin only by messages. -->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { color-scheme: light dark; --muted: #666; --line: #ddd; --wrong: #c33; }
      @media (prefers-color-scheme: dark) { :root { --muted: #aaa; --line: #444; --wrong: #f77; } }
      body { font-family: system-ui, sans-serif; margin: 16px; }
      .big { font-size: 2.4rem; font-weight: 600; font-variant-numeric: tabular-nums; margin: 4px 0; }
      .note { color: var(--muted); }
      fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 16px 0; }
      fieldset input { width: 3.5em; font-size: 1.2rem; }
      .wrong { outline: 2px solid var(--wrong); }
      #problem { color: var(--wrong); }
    </style>
  </head>
  <body>
    <p id="problem"></p>
    <p class="note">Chosen length</p>
    <p class="big" id="chosen">--:--</p>
    <p id="status" class="note">Waiting for the plugin…</p>
    <fieldset id="set" disabled>
      <legend>Set the length</legend>
      <label><input id="minutes" inputmode="numeric" maxlength="2" /> min</label>
      <label><input id="seconds" inputmode="numeric" maxlength="2" /> s</label>
      <button id="save">Set on the watch</button>
    </fieldset>
    <button id="sync">Sync now</button>
    <script src="page.js"></script>
  </body>
</html>
