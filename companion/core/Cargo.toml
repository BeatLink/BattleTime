[package]
name = "battletime-companion-core"
description = "The watch connection and protocols shared by every BattleTime Companion build"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
btleplug = "0.13"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
log = "0.4"
rquickjs = "0.14"
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
ureq = "3"
uuid = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

# QuickJS ships no bindings for Android, so they are generated there.
[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "0.14", features = ["bindgen"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
