[package]
name = "battletime-companion"
description = "The BattleTime Companion app, on the desktop and on Android"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Android loads the app as a shared library, and the desktop binary calls the same `run`.
[lib]
name = "battletime_companion_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "battletime-companion"
path = "src/main.rs"

[features]
# Serves the embedded interface rather than a development server; release builds turn it on.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
battletime-companion-core = { path = "../core" }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-phone-bridge = { path = "../tauri-plugin-phone-bridge" }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }

# The daemon reaches the phone bridge's Kotlin over JNI on Android.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"

# D-Bus and note file watching belong to the desktop.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
notify = "8"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
