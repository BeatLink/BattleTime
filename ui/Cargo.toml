[package]
name = "neotime-ui"
version = "0.1.0"
edition = "2021"
description = "Draws rlvgl widgets onto the PineTime display"
publish = false

[dependencies]
embedded-graphics = "0.8"
rlvgl-core = { version = "0.2.5", default-features = false }

[dev-dependencies]
embedded-hal = "1.0"
mipidsi = "0.10"
neotime-display = { path = "../drivers/display" }
rlvgl-widgets = { version = "0.2.5", default-features = false }
