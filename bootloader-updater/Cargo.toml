[package]
name = "neotime-bootloader-updater"
version = "0.1.0"
edition = "2021"
description = "Replaces the bootloader on a watch already running NeoTime: sent as a firmware update, it writes the bootloader it carries and hands the watch back to the firmware before it"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core", "inline-asm"] }
cortex-m-rt = "0.7"
# The NFC pins are plain GPIO on the PineTime; P0.10 resets the touch panel.
embassy-nrf = { version = "0.11", features = ["nrf52832", "rt", "nfc-pins-as-gpio"] }
embedded-graphics = "0.8"
embedded-hal = "1.0"
embedded-hal-bus = "0.3"
embedded-storage = "0.3"
panic-halt = "1.0"

neotime-boot = { path = "../boot" }
neotime-status-screen = { path = "../drivers/status_screen" }

[build-dependencies]
neotime-boot = { path = "../boot" }

[profile.release]
codegen-units = 1
debug = true
lto = true
opt-level = "s"
