[package]
name = "neotime-packages"
version = "0.1.0"
edition = "2021"
description = "NeoTime's package manager: the apps and watch faces installed in /apps on the external flash"
license.workspace = true
publish = false

[dependencies]
embedded-storage = "0.3"
heapless = "0.9"
littlefs-rust = "0.1"
serde = { version = "1", default-features = false, features = ["derive"] }
serde-json-core = "0.6"

neotime-boot = { path = "../../boot" }

neotime-runtime = { path = "../../runtime" }
neotime-storage = { path = "../storage" }

[dev-dependencies]
neotime-runtime = { path = "../../runtime", features = ["writer"] }
neotime-settings = { path = "../settings" }

# Its argument parsing has tests, which `cargo test` runs.
[[example]]
name = "filesystem_use"
test = true
