[package]
name = "neotime-companion"
version = "0.1.0"
edition = "2021"
description = "The companion app's message channel: JSON lines over the Nordic UART service, in Gadgetbridge's shape"
license.workspace = true
publish = false

[dependencies]
heapless = "0.9"
serde = { version = "1", default-features = false, features = ["derive"] }
serde-json-core = "0.6"

neotime-runtime = { path = "../../runtime" }
neotime-settings = { path = "../settings" }
